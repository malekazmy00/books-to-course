# Optional local embedding endpoint. Existing model only; no weights downloaded.
services:
  embeddinggemma:
    build:
      context: ..
      dockerfile: docker/embeddinggemma/Dockerfile
    image: b2c-embeddinggemma:0.18.0
    environment:
      B2C_EMBED_MODEL_PATH: /models/embeddinggemma.litertlm
      B2C_EMBEDDING_API_KEY_FILE: /run/secrets/b2c_embedding_api_key
      B2C_EMBED_CPU_THREADS: "4"
    volumes:
      - type: bind
        source: ${B2C_EMBEDDINGGEMMA_MODEL_FILE:-/mnt/e/B2C-Model-Lab/embeddings/embeddinggemma-2-text-270m.litertlm}
        target: /models/embeddinggemma.litertlm
        read_only: true
        bind: {create_host_path: false}
    secrets: [b2c_embedding_api_key]
    networks: [b2c_internal]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,size=512m
    mem_limit: 2g
    cpus: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s

  api:
    depends_on:
      embeddinggemma: {condition: service_healthy}
    environment:
      B2C_EMBEDDINGGEMMA_BASE_URL: http://embeddinggemma:8000/v1
      B2C_EMBEDDINGGEMMA_API_KEY_FILE: /run/secrets/b2c_embedding_api_key
    secrets: [b2c_embedding_api_key]

  worker:
    depends_on:
      embeddinggemma: {condition: service_healthy}
    environment:
      B2C_EMBEDDINGGEMMA_BASE_URL: http://embeddinggemma:8000/v1
      B2C_EMBEDDINGGEMMA_API_KEY_FILE: /run/secrets/b2c_embedding_api_key
    secrets: [b2c_embedding_api_key]

  generation-worker:
    depends_on:
      embeddinggemma: {condition: service_healthy}
    environment:
      B2C_EMBEDDINGGEMMA_BASE_URL: http://embeddinggemma:8000/v1
      B2C_EMBEDDINGGEMMA_API_KEY_FILE: /run/secrets/b2c_embedding_api_key
    secrets: [b2c_embedding_api_key]
secrets:
  b2c_embedding_api_key:
    file: ${B2C_EMBEDDING_API_KEY_HOST_FILE:?Set B2C_EMBEDDING_API_KEY_HOST_FILE to a B2C-only key file}
