# Opt-in external generation route (D-022): translation / questions through OpenRouter.
# NOT part of the default stack — CLAUDE.md rule 6 keeps local models the default.
# Enable explicitly:  make up EXTERNAL=1
# Requires the key file outside the repository (B2C_OPENROUTER_KEY_HOST_FILE).
services:
  api:
    environment:
      B2C_GENERATION_TASK_QUEUE: external-generation
      B2C_GENERATION_PROVIDER_BASE_URL: https://openrouter.ai/api/v1
      B2C_GENERATION_MODEL_ID: deepseek/deepseek-v4-flash-0731
      B2C_GENERATION_PROVIDER_KEY_FILE: /run/secrets/openrouter_api_key
      B2C_LLM_MODEL_ID: deepseek/deepseek-v4-flash-0731
      B2C_LLM_REASONING_EFFORT: "none"
    depends_on:
      generation-worker: {condition: service_started}
    volumes:
      - type: bind
        source: ${B2C_OPENROUTER_KEY_HOST_FILE:?Set B2C_OPENROUTER_KEY_HOST_FILE to a local key file}
        target: /run/secrets/openrouter_api_key
        read_only: true
        bind: {create_host_path: false}

  generation-worker:
    build: {context: .., dockerfile: docker/worker/Dockerfile.audio, args: {B2C_GIT_REVISION: "${B2C_GIT_REVISION:-unknown}"}}
    image: b2c-generation-worker:dev
    command: ["b2c-worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      B2C_PG_HOST: postgres
      B2C_PG_DB: ${B2C_PG_DB}
      B2C_PG_USER: ${B2C_PG_USER}
      B2C_PG_PASSWORD: ${B2C_PG_PASSWORD}
      B2C_S3_ENDPOINT: http://minio:9000
      B2C_S3_ACCESS_KEY: ${B2C_S3_ACCESS_KEY}
      B2C_S3_SECRET_KEY: ${B2C_S3_SECRET_KEY}
      B2C_RETRIEVAL_MODE: ${B2C_RETRIEVAL_MODE:-lexical}
      B2C_RETRIEVAL_TOP_K: ${B2C_RETRIEVAL_TOP_K:-20}
      B2C_EMBEDDING_BASE_URL: ${B2C_EMBEDDING_BASE_URL:-}
      B2C_EMBEDDING_MODEL_ID: ${B2C_EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      B2C_EMBEDDING_API_KEY_FILE: ${B2C_EMBEDDING_API_KEY_FILE:-}
      B2C_EMBEDDING_TIMEOUT_S: ${B2C_EMBEDDING_TIMEOUT_S:-30}
      B2C_GEMINI_API_KEY_FILE: ${B2C_GEMINI_API_KEY_FILE:-}
      B2C_OCR_ENGINE: ${B2C_OCR_ENGINE:-rapidocr}
      B2C_SURYA_INFERENCE_URL: ${B2C_SURYA_INFERENCE_URL:-http://surya-ocr:8080/v1}
      B2C_SURYA_MODEL: ${B2C_SURYA_MODEL:-/data/models/phase2-ocr-candidates/surya-ocr-2-gguf/surya-2.gguf}
      B2C_SURYA_MAX_TOKENS: ${B2C_SURYA_MAX_TOKENS:-16384}
      B2C_SURYA_TIMEOUT_SECONDS: ${B2C_SURYA_TIMEOUT_SECONDS:-3600}
      B2C_TEMPORAL_ADDRESS: temporal:7233
      B2C_OTEL_ENDPOINT: http://otel-collector:4318
      B2C_ARABIC_GEC_ENABLED: ${B2C_ARABIC_GEC_ENABLED:-false}
      B2C_ARABIC_GEC_MODEL_DIR: /data/models/arabic-gec
      B2C_ARABIC_GEC_SOURCE_DIR: /opt/text-editing
      B2C_ARABIC_GEC_DEVICE: cpu
      B2C_ARABIC_GEC_MANIFEST_SHA256: f54a31228d619948b16de93db568882643126b70209bfeb0a98549831c32d1ef
      OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental   # V-10
      B2C_WORKER_MODE: generation
      B2C_GENERATION_TASK_QUEUE: external-generation
      B2C_LLM_BASE_URL: https://openrouter.ai/api/v1
      B2C_LLM_MODEL_ID: deepseek/deepseek-v4-flash-0731
      B2C_LLM_ALLOW_REMOTE: "true"
      B2C_LLM_API_KEY_FILE: /run/secrets/openrouter_api_key
      B2C_LLM_REASONING_EFFORT: "none"
      B2C_LLM_TIMEOUT_S: ${B2C_LLM_TIMEOUT_S:-1200}
    networks: [b2c_internal, b2c_edge]
    volumes:
      - type: bind
        source: ${B2C_OPENROUTER_KEY_HOST_FILE:?Set B2C_OPENROUTER_KEY_HOST_FILE to a local key file}
        target: /run/secrets/openrouter_api_key
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 2g
    cpus: 2
    cpu_shares: 1024
    restart: unless-stopped
