# Gemma 4 for the rebuilt translation path (D-028): profile `gemma4` starts only the local
# Ollama server; the main worker reaches it through the translation profiles file
# (docker/translation-profiles.json, engine `gemma4-26b`, QE `gemma4-26b-mqm`).
# Heavy (≈22 GiB): use instead of `local-llm`, never together (rule 8; `make budget`).
# The older BookTrans Gemma route is kept under profile `gemma4-booktrans`.
services:
  worker:
    environment:
      B2C_TRANSLATION_PROFILES_FILE: /etc/b2c/translation-profiles.json
    volumes:
      - ./translation-profiles.json:/etc/b2c/translation-profiles.json:ro

  api:
    environment:
      B2C_TRANSLATION_PROFILES_FILE: /etc/b2c/translation-profiles.json
    volumes:
      - ./translation-profiles.json:/etc/b2c/translation-profiles.json:ro

  gemma4-ollama:
    profiles: [gemma4]
    image: ollama/ollama:0.34.0@sha256:aa6f86f01fee264c81f1edd9083ebfb07c8116d95d8bedd1ad470874b66a40b4
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - type: bind
        source: ${B2C_GEMMA4_MODELS_DIR:-${B2C_DATA_DIR}/models/ollama}   # ext4 data disk (D-020); /mnt/e is a slow 9p mount
        target: /models
        read_only: true
        bind: {create_host_path: false}
    networks: [b2c_internal]
    # 26b-a4b QAT weights ≈16 GiB + 8k context; measure the working set and adjust (rule 8)
    mem_limit: 22g
    cpus: 20
    cpu_shares: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  gemma4-generation-worker:
    profiles: [gemma4-booktrans]
    build: {context: .., dockerfile: docker/worker/Dockerfile.audio}
    image: b2c-gemma4-worker:dev
    command: ["b2c-worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      temporal-namespace: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      gemma4-ollama: {condition: service_healthy}
    environment:
      B2C_PG_HOST: postgres
      B2C_PG_DB: ${B2C_PG_DB}
      B2C_PG_USER: ${B2C_PG_USER}
      B2C_PG_PASSWORD: ${B2C_PG_PASSWORD}
      B2C_S3_ENDPOINT: http://minio:9000
      B2C_S3_ACCESS_KEY: ${B2C_S3_ACCESS_KEY}
      B2C_S3_SECRET_KEY: ${B2C_S3_SECRET_KEY}
      B2C_LLM_BASE_URL: http://gemma4-ollama:11434/v1
      B2C_LLM_MODEL_ID: gemma4:e4b
      B2C_LLM_ALLOW_REMOTE: "false"
      B2C_LLM_API_KEY_FILE: ""
      B2C_LLM_REASONING_EFFORT: "none"
      B2C_LLM_TIMEOUT_S: "600"
      B2C_WORKER_MODE: generation
      B2C_GENERATION_TASK_QUEUE: gemma4-generation
      B2C_RETRIEVAL_MODE: ${B2C_RETRIEVAL_MODE:-lexical}
      B2C_RETRIEVAL_TOP_K: ${B2C_RETRIEVAL_TOP_K:-20}
      B2C_EMBEDDING_BASE_URL: ${B2C_EMBEDDING_BASE_URL:-}
      B2C_EMBEDDING_MODEL_ID: ${B2C_EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      B2C_EMBEDDING_API_KEY_FILE: ${B2C_EMBEDDING_API_KEY_FILE:-}
      B2C_EMBEDDING_TIMEOUT_S: ${B2C_EMBEDDING_TIMEOUT_S:-30}
      B2C_GEMINI_API_KEY_FILE: ${B2C_GEMINI_API_KEY_FILE:-}
      B2C_OCR_ENGINE: ${B2C_OCR_ENGINE:-rapidocr}
      B2C_SURYA_INFERENCE_URL: ${B2C_SURYA_INFERENCE_URL:-http://surya-ocr:8080/v1}
      B2C_SURYA_MODEL: ${B2C_SURYA_MODEL:-/data/models/phase2-ocr-candidates/surya-ocr-2-gguf/surya-2.gguf}
      B2C_SURYA_MAX_TOKENS: ${B2C_SURYA_MAX_TOKENS:-16384}
      B2C_SURYA_TIMEOUT_SECONDS: ${B2C_SURYA_TIMEOUT_SECONDS:-3600}
      B2C_TEMPORAL_ADDRESS: temporal:7233
      B2C_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
    networks: [b2c_internal]
    mem_limit: 2g
    cpus: 2
    cpu_shares: 512
    restart: unless-stopped