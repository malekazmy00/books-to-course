# compose project: b2c  —  run ONLY via the Makefile, or from repo root with:
#   docker compose -p b2c --env-file .env -f docker/compose.yml -f docker/compose.observability.yml ...
# (--env-file is required: variable interpolation otherwise reads docker/.env)
#
# Every service MUST keep mem_limit / cpus / cpu_shares (docs/04-OPERATIONS.md §2; T-P0-04).
# Images are pinned tag+digest (docs/04 §5). Host ports: 127.0.0.1 only, and never
# 3002/4000/6333/6334/8080/8100/8888 (used by other projects on this server).
#
# Budget lines (docs/04 §2) → services here:
#   postgres 4g/2                          → postgres
#   temporal (+ui) 2g/1                    → temporal-schema + temporal + temporal-namespace + temporal-ui
#   llm 50g/24 (heavy, shares 512)         → llm
#   api + web + workers 6g/4               → api (512m/0.5) + worker (5g/4; serial OCR) + web budget
#   (not in the docs/04 table)             → otel-collector, prometheus, grafana, cadvisor  ≈ 1g/1.5 — see phase-0.md
#   langfuse … 8g/3                        → docker/compose.observability.yml
name: b2c

networks:
  b2c_internal:
    internal: true        # no egress, not reachable from the host
  b2c_edge: {}            # only for services that publish a 127.0.0.1 port

x-light: &light
  cpu_shares: 1024
  restart: unless-stopped
  networks: [b2c_internal]

services:
  # ---------------------------------------------------------------- data
  postgres:
    <<: *light
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${B2C_PG_DB}
      POSTGRES_USER: ${B2C_PG_USER}
      POSTGRES_PASSWORD: ${B2C_PG_PASSWORD}
      B2C_PG_TEMPORAL_PASSWORD: ${B2C_PG_TEMPORAL_PASSWORD}
      B2C_PG_LANGFUSE_PASSWORD: ${B2C_PG_LANGFUSE_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    volumes:
      - type: bind
        source: ${B2C_DATA_DIR}/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}   # never start on an empty path (D-020)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${B2C_PG_USER} -d ${B2C_PG_DB}"]
      interval: 5s
      retries: 30

  # ---------------------------------------------------------------- temporal (V-05: server + admin-tools)
  temporal-schema:
    <<: *light
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      SQL_PASSWORD: ${B2C_PG_TEMPORAL_PASSWORD}
    volumes: [./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro]
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    mem_limit: 256m
    cpus: 0.2

  temporal:
    <<: *light
    image: temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${B2C_PG_TEMPORAL_PASSWORD}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    volumes: [./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro]
    mem_limit: 1280m
    cpus: 0.6
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      start_period: 30s
      retries: 60

  temporal-namespace:
    <<: *light
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: "no"
    depends_on:
      temporal: {condition: service_healthy}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes: [./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro]
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    mem_limit: 256m
    cpus: 0.1

  temporal-ui:
    <<: *light
    image: temporalio/ui:2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5
    depends_on:
      temporal: {condition: service_healthy}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    networks: [b2c_internal, b2c_edge]
    ports: ["127.0.0.1:8233:8080"]
    mem_limit: 256m
    cpus: 0.1

  # ---------------------------------------------------------------- API (book upload + workflow status)
  api:
    <<: *light
    build: {context: .., dockerfile: docker/api/Dockerfile}
    image: b2c-api:dev
    depends_on:
      temporal: {condition: service_healthy}
      temporal-namespace: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      worker: {condition: service_started}
      generation-worker: {condition: service_started}
    environment:
      B2C_PG_HOST: postgres
      B2C_PG_DB: ${B2C_PG_DB}
      B2C_PG_USER: ${B2C_PG_USER}
      B2C_PG_PASSWORD: ${B2C_PG_PASSWORD}
      B2C_S3_ENDPOINT: http://minio:9000
      B2C_S3_ACCESS_KEY: ${B2C_S3_ACCESS_KEY}
      B2C_S3_SECRET_KEY: ${B2C_S3_SECRET_KEY}
      B2C_S3_BUCKET: artifacts
      B2C_TEMPORAL_ADDRESS: temporal:7233
      B2C_TEMPORAL_NAMESPACE: default
      B2C_MAX_UPLOAD_BYTES: ${B2C_MAX_UPLOAD_BYTES:-209715200}
      B2C_RETRIEVAL_MODE: ${B2C_RETRIEVAL_MODE:-lexical}
      B2C_RETRIEVAL_TOP_K: ${B2C_RETRIEVAL_TOP_K:-20}
      B2C_API_AUTH_REQUIRED: ${B2C_API_AUTH_REQUIRED:-false}
      B2C_APP_API_TOKEN_FILE: /run/secrets/b2c_mobile_api_token
      B2C_MODEL_PREFERENCES_FILE: /var/lib/b2c-models/model-preferences.json
      B2C_GEMMA4_ENABLED: ${B2C_GEMMA4_ENABLED:-false}
      B2C_AUDIO_TASK_QUEUE: audio
      B2C_GENERATION_TASK_QUEUE: external-generation
      B2C_GENERATION_PROVIDER_BASE_URL: https://openrouter.ai/api/v1
      B2C_GENERATION_MODEL_ID: deepseek/deepseek-v4-flash-0731
      B2C_GENERATION_PROVIDER_KEY_FILE: /run/secrets/openrouter_api_key
      B2C_LLM_MODEL_ID: deepseek/deepseek-v4-flash-0731
      B2C_LLM_REASONING_EFFORT: "none"
    volumes:
      - type: bind
        source: ${B2C_MOBILE_API_TOKEN_HOST_FILE:-/root/.config/book2course/b2c-mobile-api-token}
        target: /run/secrets/b2c_mobile_api_token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${B2C_OPENROUTER_KEY_HOST_FILE:-/root/.config/book2course/openrouter-api-key}
        target: /run/secrets/openrouter_api_key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${B2C_DATA_DIR}/state/model-preferences
        target: /var/lib/b2c-models
        bind: {create_host_path: false}
    networks: [b2c_internal, b2c_edge]
    ports: ["127.0.0.1:${B2C_API_PORT:-8100}:8000"]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8).read()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------- llm (heavy)
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11176@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af
    command: >
      -m /models/${B2C_LLM_GGUF}
      --alias ${B2C_LLM_MODEL_ID}
      --host 0.0.0.0 --port 8080
      -t ${B2C_LLM_THREADS} -c ${B2C_LLM_CTX} --parallel 2 -n ${B2C_LLM_MAX_TOKENS:-2048} --jinja
    volumes:
      - ${B2C_MODELS_DIR}:/models:ro          # read-only; never write into Ollama's store
    networks: [b2c_internal]
    mem_limit: 50g
    cpus: 24
    cpu_shares: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      start_period: 600s
      retries: 30

  # Optional quality-mode OCR. Activate with --profile surya; internal B2C network only.
  surya-ocr:
    profiles: [surya]
    image: ghcr.io/ggml-org/llama.cpp:server-b11176@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af
    command:
      - -m
      - /data/models/phase2-ocr-candidates/surya-ocr-2-gguf/surya-2.gguf
      - --mmproj
      - /data/models/phase2-ocr-candidates/surya-ocr-2-gguf/surya-2-mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - ${B2C_SURYA_THREADS:-28}
      - --parallel
      - "1"
      - --ctx-size
      - ${B2C_SURYA_CTX:-32768}
      - --image-min-tokens
      - "1024"
      - --jinja
    volumes:
      - type: bind
        source: ${B2C_DATA_DIR}/models
        target: /data/models
        read_only: true
        bind: {create_host_path: false}
    networks: [b2c_internal]
    mem_limit: ${B2C_SURYA_MEM_LIMIT:-16g}
    cpus: ${B2C_SURYA_CPU_LIMIT:-28}
    cpu_shares: 1024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 600s

  # Fallback OpenAI-compatible mock (tests / when no GGUF): `--profile mock`, set B2C_LLM_BASE_URL.
  llm-mock:
    <<: *light
    profiles: [mock]
    build: {context: .., dockerfile: docker/worker/Dockerfile}
    image: b2c-worker:dev
    command: ["python", "-m", "b2c_llm_gateway.mock_server", "--port", "8080"]
    mem_limit: 128m
    cpus: 0.1

  # ---------------------------------------------------------------- workers
  worker:
    <<: *light
    build: {context: .., dockerfile: docker/worker/Dockerfile}
    image: b2c-worker:dev
    command: ["b2c-worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal-namespace: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    environment: &worker-env
      B2C_PG_HOST: postgres
      B2C_PG_DB: ${B2C_PG_DB}
      B2C_PG_USER: ${B2C_PG_USER}
      B2C_PG_PASSWORD: ${B2C_PG_PASSWORD}
      B2C_S3_ENDPOINT: http://minio:9000
      B2C_S3_ACCESS_KEY: ${B2C_S3_ACCESS_KEY}
      B2C_S3_SECRET_KEY: ${B2C_S3_SECRET_KEY}
      B2C_LLM_BASE_URL: ${B2C_LLM_BASE_URL}
      B2C_LLM_MODEL_ID: ${B2C_LLM_MODEL_ID}
      # Long local structured QA prompts need more than 10 minutes; avoid duplicate retries while server cancellation drains.
      B2C_LLM_TIMEOUT_S: ${B2C_LLM_TIMEOUT_S:-1200}
      B2C_LLM_ALLOW_REMOTE: ${B2C_LLM_ALLOW_REMOTE:-false}
      B2C_LLM_API_KEY_FILE: ${B2C_LLM_API_KEY_FILE:-}
      B2C_RETRIEVAL_MODE: ${B2C_RETRIEVAL_MODE:-lexical}
      B2C_RETRIEVAL_TOP_K: ${B2C_RETRIEVAL_TOP_K:-20}
      B2C_EMBEDDING_BASE_URL: ${B2C_EMBEDDING_BASE_URL:-}
      B2C_EMBEDDING_MODEL_ID: ${B2C_EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      B2C_EMBEDDING_API_KEY_FILE: ${B2C_EMBEDDING_API_KEY_FILE:-}
      B2C_EMBEDDING_TIMEOUT_S: ${B2C_EMBEDDING_TIMEOUT_S:-30}
      B2C_GEMINI_API_KEY_FILE: ${B2C_GEMINI_API_KEY_FILE:-}
      B2C_OCR_ENGINE: ${B2C_OCR_ENGINE:-rapidocr}
      B2C_SURYA_INFERENCE_URL: ${B2C_SURYA_INFERENCE_URL:-http://surya-ocr:8080/v1}
      B2C_SURYA_MODEL: ${B2C_SURYA_MODEL:-/data/models/phase2-ocr-candidates/surya-ocr-2-gguf/surya-2.gguf}
      B2C_SURYA_MAX_TOKENS: ${B2C_SURYA_MAX_TOKENS:-16384}
      B2C_SURYA_TIMEOUT_SECONDS: ${B2C_SURYA_TIMEOUT_SECONDS:-3600}
      B2C_TEMPORAL_ADDRESS: temporal:7233
      B2C_OTEL_ENDPOINT: http://otel-collector:4318
      B2C_ARABIC_GEC_ENABLED: ${B2C_ARABIC_GEC_ENABLED:-false}
      B2C_ARABIC_GEC_MODEL_DIR: /data/models/arabic-gec
      B2C_ARABIC_GEC_SOURCE_DIR: /opt/text-editing
      B2C_ARABIC_GEC_DEVICE: cpu
      B2C_ARABIC_GEC_MANIFEST_SHA256: f54a31228d619948b16de93db568882643126b70209bfeb0a98549831c32d1ef
      OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental   # V-10
    volumes:
      - type: bind
        source: ${B2C_DATA_DIR}/models/arabic-gec
        target: /data/models/arabic-gec
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${B2C_DATA_DIR}/build-context/text-editing
        target: /opt/text-editing
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 5g
    cpus: 4

  # Isolated, single-activity queue for audio generation. Does not restart or compete
  # for work on the existing HEAVY worker that may be processing OCR/QA/translation.
  audio-worker:
    <<: *light
    build: {context: .., dockerfile: docker/worker/Dockerfile.audio}
    image: b2c-audio-worker:dev
    command: ["b2c-worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      <<: *worker-env
      B2C_WORKER_MODE: audio
      B2C_AUDIO_TASK_QUEUE: audio
      B2C_AUDIO_RENDERER_URL: http://audio-renderer:3008
    mem_limit: 2g
    cpus: 4

  generation-worker:
    <<: *light
    build: {context: .., dockerfile: docker/worker/Dockerfile.audio}
    image: b2c-generation-worker:dev
    command: ["b2c-worker"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      <<: *worker-env
      B2C_WORKER_MODE: generation
      B2C_GENERATION_TASK_QUEUE: external-generation
      B2C_LLM_BASE_URL: https://openrouter.ai/api/v1
      B2C_LLM_MODEL_ID: deepseek/deepseek-v4-flash-0731
      B2C_LLM_ALLOW_REMOTE: "true"
      B2C_LLM_API_KEY_FILE: /run/secrets/openrouter_api_key
      B2C_LLM_REASONING_EFFORT: "none"
      B2C_LLM_TIMEOUT_S: ${B2C_LLM_TIMEOUT_S:-1200}
    networks: [b2c_internal, b2c_edge]
    volumes:
      - type: bind
        source: ${B2C_OPENROUTER_KEY_HOST_FILE:-/root/.config/book2course/openrouter-api-key}
        target: /run/secrets/openrouter_api_key
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 2g
    cpus: 2

  # ---------------------------------------------------------------- observability (collector + metrics)
  otel-collector:
    <<: *light
    # core distribution: has otlp receiver, memory_limiter, batch, otlphttp — all we use.
    # (contrib at 256m thrashed: ~500 MB binary evicted/re-read; measured idle RSS of core ≈ 17 MiB)
    image: otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      LANGFUSE_OTEL_AUTH: ${LANGFUSE_OTEL_AUTH}
    volumes: [./otel/collector.yaml:/etc/otelcol/collector.yaml:ro]
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    <<: *light
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - type: bind
        source: ${B2C_DATA_DIR}/prometheus
        target: /prometheus
        bind: {create_host_path: false}   # never start on an empty path (D-020)
    mem_limit: 384m
    cpus: 0.5

  grafana:
    <<: *light
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - type: bind
        source: ${B2C_DATA_DIR}/grafana
        target: /var/lib/grafana
        bind: {create_host_path: false}   # never start on an empty path (D-020)
    networks: [b2c_internal, b2c_edge]
    ports: ["127.0.0.1:3000:3000"]
    # measured: ~39 MiB anon + ~185 MiB mapped binary; 192m thrashed (11 GB of re-reads)
    mem_limit: 384m
    cpus: 0.25

  # Read-only observer. Prometheus keeps only com.docker.compose.project=b2c series.
  cadvisor:
    <<: *light
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      # `disk`/`diskIO` disabled: the disk-usage crawl walks every image layer on the host
      # (measured: pinned a 1g cgroup with fs cache and kept the shared disk busy)
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices: [/dev/kmsg]
    mem_limit: 256m
    cpus: 0.25
