global
    log stdout format raw local0
    maxconn 128

defaults
    log global
    mode http
    option httplog
    timeout connect 10s
    timeout client 900s
    timeout server 900s

frontend hy_translation_frontend
    bind :3007
    default_backend hy_translation_backends

resolvers docker
    nameserver dockerdns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

backend hy_translation_backends
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    server hy1 hy-translation:3007 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none
    server hy2 hy-translation-2:3007 check inter 5s fall 3 rise 2 resolvers docker init-addr libc,none
