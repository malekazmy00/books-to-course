# OTel Collector: OTLP in -> Langfuse (OTLP/HTTP only, V-08). Own metrics for Prometheus on :8888.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40
  batch:
    timeout: 2s

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel   # exporter appends /v1/traces
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_AUTH}"
      x-langfuse-ingestion-version: "4"                  # real-time on the v4 data model (V-08)

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse]
