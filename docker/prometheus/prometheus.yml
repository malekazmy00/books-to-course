global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Alert delivery: the opt-in alertmanager service (docker/compose.alerts-telegram.yml). Without it,
# alerts stay visible in Prometheus/Grafana and notification attempts fail harmlessly.
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]

  - job_name: temporal
    static_configs: [{targets: ["temporal:8000"]}]

  # cAdvisor sees every container on the host; keep only compose project b2c (docs/04 §6.1).
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: b2c
        action: keep
