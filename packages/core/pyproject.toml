[project]
name = "b2c-core"
version = "0.1.0"
description = "Cross-cutting: stage_key, ArtifactStore (S3), ProvRecorder (W3C PROV tables), config, JSON logging."
requires-python = ">=3.11"
dependencies = [
    "b2c-contracts",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
b2c-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_core"]
