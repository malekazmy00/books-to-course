[project]
name = "b2c-episodes"
version = "0.0.0"
description = "Derived formats (EN, D-035..D-038): grounded, validated episode scripts (intro + recap, summary, key terms, five questions, others say; episode 00 course introduction) -> EpisodeScript; script translation units and the Arabic script assembly."
requires-python = ">=3.12"
dependencies = ["b2c-contracts", "pydantic>=2.7,<3"]

[tool.uv.sources]
b2c-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_episodes"]
