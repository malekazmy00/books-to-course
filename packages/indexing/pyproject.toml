[project]
name = "b2c-indexing"
version = "0.0.0"
description = "L3 Chunking & Index: ParsedBook -> StructuredChunk[] + embeddings."
requires-python = ">=3.12"
dependencies = ["b2c-contracts", "b2c-core", "b2c-llm-gateway", "psycopg[binary]>=3.2,<4"]

[tool.uv.sources]
b2c-contracts = { workspace = true }
b2c-core = { workspace = true }
b2c-llm-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_indexing"]
