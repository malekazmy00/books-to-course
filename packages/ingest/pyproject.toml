[project]
name = "b2c-ingest"
version = "0.0.0"
description = "L1 Ingestion: PDFs to provenance-preserving ParsedBook blocks, including Docling OCR."
requires-python = ">=3.12"
dependencies = [
    "b2c-contracts",
    "b2c-core",
    "b2c-llm-gateway",
    "pypdf==6.1.3",
    "python-bidi>=0.6,<1",
]

[project.optional-dependencies]
docling = ["docling>=2.50,<3", "torch", "torchvision", "onnxruntime>=1.20,<2", "numpy>=2,<3", "pypdfium2==5.13.0"]

[tool.uv.sources]
b2c-contracts = { workspace = true }
b2c-core = { workspace = true }
b2c-llm-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_ingest"]
