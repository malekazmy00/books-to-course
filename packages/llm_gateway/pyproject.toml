[project]
name = "b2c-llm-gateway"
version = "0.1.0"
description = "The only path to LLMs: OpenAI-compatible client for local llama-server, Postgres cache, JSON-schema structured output, OTel GenAI spans. No cloud providers (D-004)."
requires-python = ">=3.11"
dependencies = [
    "b2c-contracts",
    "b2c-core",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "opentelemetry-api>=1.27,<2",
]

[tool.uv.sources]
b2c-contracts = { workspace = true }
b2c-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_llm_gateway"]
