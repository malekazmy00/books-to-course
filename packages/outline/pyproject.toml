[project]
name = "b2c-outline"
version = "0.0.0"
description = "L2 Outline: ParsedBook -> CourseOutline."
requires-python = ">=3.11"
dependencies = ["b2c-contracts", "b2c-core", "b2c-llm-gateway"]

[tool.uv.sources]
b2c-contracts = { workspace = true }
b2c-core = { workspace = true }
b2c-llm-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_outline"]
