[project]
name = "b2c-research"
version = "0.0.0"
description = "Knowledge research (EN, D-034/D-035): official APIs first, pluggable web search, sandboxed extraction, cited claims checked by an independent judge -> KnowledgeDossier."
requires-python = ">=3.12"
dependencies = ["b2c-contracts", "httpx>=0.27,<1", "pydantic>=2.7,<3"]

[tool.uv.sources]
b2c-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_research"]
