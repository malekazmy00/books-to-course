[project]
name = "b2c-translation"
version = "0.0.0"
description = "L7 Translation: termbase, QE routing, review queue."
requires-python = ">=3.12"
dependencies = ["b2c-contracts", "b2c-core", "b2c-llm-gateway", "pysbd==0.3.4", "wordfreq==3.1.1"]

[tool.uv.sources]
b2c-contracts = { workspace = true }
b2c-core = { workspace = true }
b2c-llm-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2c_translation"]
