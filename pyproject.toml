[project]
name = "book2course"
version = "0.0.0"
description = "Research (non-commercial) platform: books -> Arabic-narrated courses. Workspace root."
requires-python = ">=3.11"
dependencies = [
    "b2c-contracts",
    "b2c-core",
    "b2c-llm-gateway",
    "b2c-orchestration",
    "b2c-ingest",
    "b2c-outline",
    "b2c-indexing",
    "b2c-kg",
    "b2c-synthesis",
    "b2c-pedagogy",
    "b2c-translation",
    "b2c-speech",
    "b2c-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "moto[s3]>=5.0",
    "opentelemetry-sdk>=1.27,<2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
b2c-contracts = { workspace = true }
b2c-core = { workspace = true }
b2c-llm-gateway = { workspace = true }
b2c-orchestration = { workspace = true }
b2c-ingest = { workspace = true }
b2c-outline = { workspace = true }
b2c-indexing = { workspace = true }
b2c-kg = { workspace = true }
b2c-synthesis = { workspace = true }
b2c-pedagogy = { workspace = true }
b2c-translation = { workspace = true }
b2c-speech = { workspace = true }
b2c-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the running b2c compose stack (run inside the b2c network via `make test-integration`)",
]

# ---------------------------------------------------------------- layer boundaries (T-P0-01)
# docs/01-ARCHITECTURE.md §10 + CLAUDE.md rule 4/5.
[tool.importlinter]
root_packages = [
    "b2c_contracts",
    "b2c_core",
    "b2c_llm_gateway",
    "b2c_orchestration",
    "b2c_ingest",
    "b2c_outline",
    "b2c_indexing",
    "b2c_kg",
    "b2c_synthesis",
    "b2c_pedagogy",
    "b2c_translation",
    "b2c_speech",
    "b2c_api",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "contracts imports no other project package"
type = "forbidden"
source_modules = ["b2c_contracts"]
forbidden_modules = [
    "b2c_core", "b2c_llm_gateway", "b2c_orchestration", "b2c_ingest", "b2c_outline",
    "b2c_indexing", "b2c_kg", "b2c_synthesis", "b2c_pedagogy", "b2c_translation",
    "b2c_speech", "b2c_api",
]

[[tool.importlinter.contracts]]
name = "core depends only on contracts"
type = "forbidden"
source_modules = ["b2c_core"]
forbidden_modules = [
    "b2c_llm_gateway", "b2c_orchestration", "b2c_ingest", "b2c_outline", "b2c_indexing",
    "b2c_kg", "b2c_synthesis", "b2c_pedagogy", "b2c_translation", "b2c_speech", "b2c_api",
]

[[tool.importlinter.contracts]]
name = "llm_gateway depends only on contracts + core"
type = "forbidden"
source_modules = ["b2c_llm_gateway"]
forbidden_modules = [
    "b2c_orchestration", "b2c_ingest", "b2c_outline", "b2c_indexing", "b2c_kg",
    "b2c_synthesis", "b2c_pedagogy", "b2c_translation", "b2c_speech", "b2c_api",
]

[[tool.importlinter.contracts]]
name = "layer packages are independent of each other"
type = "independence"
modules = [
    "b2c_ingest", "b2c_outline", "b2c_indexing", "b2c_kg", "b2c_synthesis",
    "b2c_pedagogy", "b2c_translation", "b2c_speech",
]

[[tool.importlinter.contracts]]
name = "layer packages never import orchestration or api"
type = "forbidden"
source_modules = [
    "b2c_ingest", "b2c_outline", "b2c_indexing", "b2c_kg", "b2c_synthesis",
    "b2c_pedagogy", "b2c_translation", "b2c_speech",
]
forbidden_modules = ["b2c_orchestration", "b2c_api"]

[[tool.importlinter.contracts]]
name = "LLM access only through llm_gateway (no direct HTTP clients to model servers)"
type = "forbidden"
source_modules = [
    "b2c_core", "b2c_orchestration", "b2c_ingest", "b2c_outline", "b2c_indexing", "b2c_kg",
    "b2c_synthesis", "b2c_pedagogy", "b2c_translation", "b2c_speech",
]
forbidden_modules = ["openai", "httpx", "requests", "aiohttp"]
# Only direct imports are banned: going through b2c_llm_gateway (which uses httpx) is the allowed path.
allow_indirect_imports = true
